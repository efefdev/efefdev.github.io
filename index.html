<body>

  <nav class="nav" aria-label="Bölümler">

    <a href="#deneyim">Deneyim</a>
    <a href="#projelerim">Projeler</a>

  <header class="hero" id="top">
    <div class="hero-inner">
      <h1>Merhaba, ben <span class="hl">Efe</span></h1>
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
      <div class="cta">
        <a class="pill pill-white" href="#projelerim">Projelerim</a>
        <a class="pill pill-glass" href="#hakkimda">Hakkımda <svg class="i" viewBox="0 0 24 24"><path d="M18 8l4 4-4 4M2 12h20"/></svg></a>

    <a class="scroll-cue" href="#hakkimda" aria-label="Aşağı kaydır"><span></span></a>

  <main>
    <section id="hakkimda">

      <div class="glass about">

        <div class="focus" id="focus"></div>

    <section id="deneyim">
      <h2><svg class="i" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>Deneyim</h2>
      <div class="glass"><ol class="timeline" id="experience"></ol></div>
    </section>

    <section id="sertifikalarim">
      <h2><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.5 12.9L17 22l-5-3-5 3 1.5-9.1"/></svg>Sertifikalarım</h2>

      <div class="bento" id="projects"></div>

      <div class="grid-2" id="secItems"></div>

        <div class="mail-row">
          <a class="mail-big" id="emailBig" href="#"></a>
          <button class="copy" id="copyBtn" type="button">Kopyala</button>
        </div>
        <div class="socials" id="socials"></div>
      </div>

  <footer>
